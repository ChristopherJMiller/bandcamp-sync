[package]
name = "bandcamp-sync"
version = "0.1.1"
edition = "2024"
authors = ["Chris M <hello@chrismiller.xyz>"]
description = "Sync your Bandcamp collection to local and remote destinations"
license = "GPL-3.0"

# Optimization settings for release builds
[profile.release]
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Single codegen unit for better optimization
panic = "abort"   # Abort on panic instead of unwinding
strip = true      # Strip symbols for smaller binary
opt-level = 3     # Maximum optimization level

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dialoguer = "0.11"

# HTTP and WebDAV
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
reqwest_dav = "0.2"

# Browser automation for login (WebDriver)
thirtyfour = "0.34"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTML/Web scraping
scraper = "0.22"
html-escape = "0.2"

# Progress and UI
indicatif = "0.17"
colored = "2.1"

# System info
num_cpus = "1.16"

# Security
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system
dirs = "5.0"
tempfile = "3.14"

# Utilities
regex = "1.11"
chrono = "0.4"
url = "2.5"
futures = "0.3"
async-trait = "0.1"
zip = "2.2"
urlencoding = "2.1"
